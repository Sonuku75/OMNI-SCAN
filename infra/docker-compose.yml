version: "3.9"

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: omniscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniscan
      POSTGRES_PASSWORD: omniscan_password
      POSTGRES_DB: omniscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniscan -d omniscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis - Background Task Broker
  redis:
    image: redis:7-alpine
    container_name: omniscan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO - Private S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: omniscan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. FastAPI Backend Service (Milestone 1+)
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: omniscan-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://omniscan:omniscan_password@db:5432/omniscan_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=minio
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=omniscan-media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 5. Web Frontend Service (Next.js)
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: omniscan-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
